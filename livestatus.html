<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aagman — Live Train Status &amp; Rail Intelligence</title>
  
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #F8F9FB;
      color: #0F172A;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* Splash Screen */
    .splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0F172A;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.4s ease;
      padding: 0 24px;
      box-sizing: border-box;
    }
    .splash-logo-container {
      background-color: #FFFFFF;
      padding: clamp(24px, 4vw, 40px) clamp(32px, 5vw, 48px);
      border-radius: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(20px, 3vw, 32px);
      transition: transform 0.4s ease;
      max-width: 100%;
      box-sizing: border-box;
    }
    .splash-logo {
      width: clamp(220px, 40vw, 420px);
      height: auto;
      object-fit: contain;
    }
    .splash-loader {
      width: clamp(48px, 10vw, 80px);
      height: clamp(4px, 0.8vw, 6px);
      background: #E2E8F0;
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }
    .splash-loader::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 50%;
      background: #2563EB;
      border-radius: 3px;
      animation: splash-loading 1s ease-in-out infinite alternate;
    }
    @keyframes splash-loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }
  </style>
</head>
<body>

  <!-- Splash Screen -->
  <div id="aagman-splash" class="splash-screen" aria-hidden="true">
    <div class="splash-logo-container">
      <img src="/logo.jpg" alt="Aagman Logo" class="splash-logo">
      <div class="splash-loader"></div>
    </div>
  </div>
  <script>
    (function() {
      var navEntry = performance.getEntriesByType("navigation")[0];
      var isReload = navEntry && navEntry.type === "reload";
      if (sessionStorage.getItem('aagmanSplashShown') && !isReload) {
        var el = document.getElementById('aagman-splash');
        if (el) el.style.display = 'none';
      } else {
        setTimeout(function() {
          var splash = document.getElementById("aagman-splash");
          if (splash) {
            splash.style.opacity = '0';
            setTimeout(function() {
              splash.style.display = 'none';
              sessionStorage.setItem('aagmanSplashShown', 'true');
            }, 400);
          }
        }, 1200);
      }
    })();
  </script>

  <!-- React Root Container -->
  <div id="root"></div>

  <!-- Main React Bundle -->
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
